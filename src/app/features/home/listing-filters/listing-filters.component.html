<form [formGroup]="form" class="rounded-xl border bg-white p-4 shadow-sm" novalidate>
  <div class="grid gap-3 md:grid-cols-4">
    <div class="md:col-span-2">
      <label for="f-location" class="mb-1 block text-sm">Location</label>
      <input id="f-location" type="text" formControlName="location" class="input"
        placeholder="City, street or building name" />
    </div>

    <div>
      <label for="f-min" class="mb-1 block text-sm">Min price (₹)</label>
      <input id="f-min" type="number" formControlName="minPrice" class="input" min="0" />
    </div>

    <div>
      <label for="f-max" class="mb-1 block text-sm">Max price (₹)</label>
      <input id="f-max" type="number" formControlName="maxPrice" class="input" min="0" />
    </div>
  </div>

  @if (form.controls.minPrice.hasError('min') || form.controls.maxPrice.hasError('min')) {
    <p class="error">Price cannot be negative</p>
  }
  @if (form.hasError('range')) {
    <p class="error">Min price cannot be greater than max price</p>
  }

  <details class="mt-3">
    <summary class="cursor-pointer text-sm font-medium text-teal-700">Amenities</summary>
    <div formGroupName="amenities" class="mt-2 grid gap-2 sm:grid-cols-2 lg:grid-cols-4">
      @for (a of amenities; track a) {
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" [formControlName]="a" /> {{ a }}
        </label>
      }
    </div>
  </details>

  <button type="button" class="btn-outline mt-3" (click)="reset()">Reset filters</button>
</form>
