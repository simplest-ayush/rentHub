<article class="flex h-full flex-col overflow-hidden rounded-xl border bg-white shadow-sm">
  <img [src]="listing().photos[0]" [alt]="listing().title" loading="lazy" class="h-48 w-full object-cover" />

  <div class="flex flex-1 flex-col p-4">
    <h3 class="text-lg font-bold">{{ listing().title }}</h3>
    <p class="text-sm text-gray-500">{{ listing().street }}</p>
    <p class="mt-2 line-clamp-2 text-sm text-gray-700">{{ listing().description }}</p>
    <p class="mt-3 text-lg font-semibold text-teal-700">
      {{ listing().rent | currency: 'INR' : 'symbol' : '1.0-0' }}
      <span class="text-sm font-normal text-gray-500">
        {{ listing().priceMode === 'perMonth' ? '/month' : '(utilities included)' }}
      </span>
    </p>

    <div class="mt-auto flex flex-wrap gap-2 pt-4">
      <a [routerLink]="['/listings', listing().id]" class="btn">View Details</a>
      <button type="button" class="btn-outline" [attr.aria-pressed]="isFavourite()"
        (click)="favouriteToggle.emit(listing().id)">
        {{ isFavourite() ? 'Remove Favourite' : 'Mark as Favourite' }}
      </button>
    </div>
  </div>
</article>
